interface:
  display_name: "领域论文搜集、分类与总结"
  short_description: "检索论文，跳过无明确问题的记录，提炼领域核心问题并分类生成 Markdown"
  default_prompt: "Use $literature-evidence-synthesis to find the requested number of papers in my field (default 50), ask for the year range if missing, skip papers with no identifiable problem, synthesize core field problems, classify valid papers, and create one summary.md per paper."
